name: C++ engine
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: deps
          key: dce-boost-1.86.0-json-3.11.3-${{ runner.os }}-${{ hashFiles('scripts/deps.sh') }}
      - run: sh scripts/deps.sh
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j 3
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ matrix.os }}
          path: |
            build/Testing/Temporary/
            run/
