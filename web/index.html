<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DCE · Compute Console</title>
<style>body{font:16px system-ui;background:#101722;color:#e8edf5;max-width:1150px;margin:40px auto;padding:0 24px}h1{font-size:32px}small{color:#95a7bc}section{background:#1b2534;border:1px solid #324057;border-radius:12px;padding:20px;margin:22px 0}input,select,button{font:inherit;padding:9px;border-radius:6px;border:1px solid #65768c;margin:5px;background:#111b29;color:inherit}button{background:#376fd3;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #324057}pre{white-space:pre-wrap;word-break:break-word}#error{color:#ffadad}.cards{display:flex;gap:25px;flex-wrap:wrap}progress{width:110px}label{display:inline-block}a{color:#9cc5ff}</style>
<h1>Distributed Compute Engine</h1><small>C++20 · Coordinator / worker console · At-least-once execution</small><p id="error" role="status"></p>
<section><h2>Submit computation</h2><form id="submit"><label>Workload <select id="type"><option value="primes">Prime count</option><option value="csv">Numeric CSV statistics</option></select></label><label>Start (inclusive) <input id="start" type="number" min="0" value="0"></label><label>End (exclusive) <input id="end" type="number" value="1000000" min="1"></label><label>Shared CSV filename <input id="file" value="numbers.csv"></label><label>Partitions <input id="parts" type="number" min="1" max="128" value="12"></label><button>Run job</button></form><small>CSV: numeric cells, no header. Place the same file in each worker’s shared data directory.</small></section>
<section><h2>Workers</h2><div id="workers" class="cards"></div></section><section><h2>Jobs</h2><div id="counts"></div><div style="overflow:auto"><table><thead><tr><th>Job</th><th>Workload</th><th>State</th><th>Progress</th><th>Elapsed</th><th>Result</th></tr></thead><tbody id="jobs"></tbody></table></div></section>
<script>
const el=id=>document.getElementById(id);const text=(tag,s)=>{let x=document.createElement(tag);x.textContent=s;return x};async function api(path,options){let r=await fetch(path,options),j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j}
async function refresh(){try{let [workers,jobs]=await Promise.all([api('/workers'),api('/jobs')]);el('workers').replaceChildren(...workers.map(w=>{let d=document.createElement('div');d.append(text('strong',w.id),text('p',`${w.alive?'● Online':'○ Offline'} · ${w.load}/${w.capacity} slots`),text('small',`Heartbeat ${Math.round(w.heartbeat_age_ms)} ms · utilization ${(w.utilization*100).toFixed(1)}%`));return d}));el('counts').textContent=['queued','running','completed','failed'].map(s=>`${jobs.filter(j=>j.state===s).length} ${s}`).join(' · ');el('jobs').replaceChildren(...jobs.slice(-100).reverse().map(j=>{let tr=document.createElement('tr');for(let s of [j.id,j.type,j.state,`${j.completed_tasks}/${j.total_tasks}`,`${j.elapsed_seconds.toFixed(2)} s`,j.result?JSON.stringify(j.result):'—'])tr.append(text('td',s));return tr}));}catch(e){el('error').textContent=e.message}}
el('submit').onsubmit=async e=>{e.preventDefault();let j={type:el('type').value,partitions:Number(el('parts').value)};if(j.type==='csv')j.file=el('file').value;else Object.assign(j,{start:Number(el('start').value),end:Number(el('end').value)});try{let r=await api('/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(j)});el('error').textContent=`Submitted ${r.id}`;refresh()}catch(e){el('error').textContent=e.message}};async function poll(){await refresh();setTimeout(poll,1000)}poll();
</script></html>
